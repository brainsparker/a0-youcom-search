# You.com Search plugin configuration
# Optional key. Leave empty to use YDC_API_KEY from Agent Zero secrets / env,
# or the keyless endpoint (no account, 100 searches a day) if neither is set.
api_key: ""
results: 10        # max results returned to the agent
timeout: 15        # HTTP timeout in seconds
fallback_to_searxng: true   # when the free daily limit is hit, run the built-in SearXNG search instead
